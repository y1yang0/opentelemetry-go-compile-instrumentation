{{ $icon := .Get "icon" | default "fa-lightbulb" -}}
<div class="col-lg-4 mb-5 mb-lg-0 text-center">
  <div class="feature-card h-100 d-flex flex-column">
    <div class="mb-4 h1">
      <i class="{{ if not (or (hasPrefix $icon "fas ") (hasPrefix $icon "fab ")) }}fas {{ end }}{{ $icon }}"></i>
    </div>
    <h4 class="h3">
      {{- .Get "title" | markdownify -}}
    </h4>
    <div class="mb-4 flex-grow-1">
      {{ .Inner }}
    </div>
    {{ with .Get "url" }}
      <div class="mt-auto">
        <a href="{{ . }}">{{ with $.Get "url_text" }}{{ . }}{{ else }}{{ T "ui_read_more" }}{{ end }}</a>
      </div>
    {{ end }}
  </div>
</div>
